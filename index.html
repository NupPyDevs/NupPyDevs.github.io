<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NupPy Sunumlar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0d0d0d;
  color: #e8e8e8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

header {
  border-bottom: 1px solid #222;
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  font-size: 20px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 0.5px;
}

header p {
  font-size: 13px;
  color: #666;
}

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 64px 48px;
}

.intro {
  margin-bottom: 56px;
}

.intro h2 {
  font-size: 32px;
  font-weight: 300;
  color: #fff;
  margin-bottom: 12px;
}

.intro p {
  font-size: 15px;
  color: #888;
  line-height: 1.7;
}

.section-title {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #555;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid #1a1a1a;
}

.category {
  margin-bottom: 56px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  padding: 24px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-decoration: none;
  display: block;
}

.card:hover {
  border-color: #333;
  background: #161616;
}

.card-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.label-edebiyat { color: #a78bfa; }
.label-cografya  { color: #34d399; }
.label-fizik     { color: #60a5fa; }

.card-title {
  font-size: 15px;
  font-weight: 500;
  color: #e8e8e8;
  margin-bottom: 8px;
  line-height: 1.4;
}

.card-meta {
  font-size: 12px;
  color: #555;
}

.card-icon {
  float: right;
  font-size: 18px;
  opacity: 0.3;
  margin-top: -2px;
}

.empty-card {
  background: #0d0d0d;
  border: 1px dashed #1e1e1e;
  border-radius: 10px;
  padding: 24px;
  color: #333;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}

footer {
  border-top: 1px solid #1a1a1a;
  padding: 24px 48px;
  text-align: center;
  font-size: 12px;
  color: #444;
}
</style>
</head>
<body>

<header>
  <h1>NupPy</h1>
  <p>Sunum Arşivi</p>
</header>

<main>
  <div class="intro">
    <h2>Ders Sunumları</h2>
    <p>Edebiyat, Coğrafya ve Fizik derslerine ait sunum arşivi.</p>
  </div>

  <!-- EDEBİYAT -->
  <div class="category">
    <div class="section-title">Edebiyat</div>
    <div class="card-grid">
      <!-- Sunum eklemek için bu kartı kopyala ve href'i Google Slides linkinle değiştir -->
      <!-- <a class="card" href="GOOGLE_SLIDES_LINK" target="_blank">
        <span class="card-icon">↗</span>
        <div class="card-label label-edebiyat">Edebiyat</div>
        <div class="card-title">Sunum Başlığı</div>
        <div class="card-meta">Tarih</div>
      </a> -->
      <div class="empty-card">+ Henüz sunum eklenmedi</div>
    </div>
  </div>

  <!-- COĞRAFYA -->
  <div class="category">
    <div class="section-title">Coğrafya</div>
    <div class="card-grid">
      <div class="empty-card">+ Henüz sunum eklenmedi</div>
    </div>
  </div>

  <!-- FİZİK -->
  <div class="category">
    <div class="section-title">Fizik</div>
    <div class="card-grid">
      <div class="empty-card">+ Henüz sunum eklenmedi</div>
    </div>
  </div>

</main>

<footer>
  nuppydevs.github.io — NupPy
</footer>

</body>
</html>
