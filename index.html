<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NupPy Sunumlar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d0d;
  color: #e8e8e8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

header {
  border-bottom: 1px solid #1e1e1e;
  padding: 0 48px;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
}

.logo {
  font-size: 18px;
  font-weight: 500;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 20px 0;
}

nav {
  display: flex;
  align-items: stretch;
  gap: 0;
}

nav button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: #555;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 20px 24px;
  transition: color 0.2s, border-color 0.2s;
  letter-spacing: 0.3px;
}

nav button:hover { color: #aaa; }

nav button.active-edebiyat { color: #a78bfa; border-bottom-color: #a78bfa; }
nav button.active-cografya { color: #34d399; border-bottom-color: #34d399; }
nav button.active-fizik    { color: #60a5fa; border-bottom-color: #60a5fa; }

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 56px 48px;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

.tab-header {
  margin-bottom: 40px;
}

.tab-header h2 {
  font-size: 28px;
  font-weight: 300;
  color: #fff;
  margin-bottom: 8px;
}

.tab-header p {
  font-size: 14px;
  color: #666;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  padding: 24px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-decoration: none;
  display: block;
}

.card:hover { border-color: #333; background: #161616; }

.card-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.label-edebiyat { color: #a78bfa; }
.label-cografya  { color: #34d399; }
.label-fizik     { color: #60a5fa; }

.card-title {
  font-size: 15px;
  font-weight: 500;
  color: #e8e8e8;
  margin-bottom: 8px;
  line-height: 1.4;
}

.card-meta { font-size: 12px; color: #555; }

.card-icon {
  float: right;
  font-size: 18px;
  opacity: 0.3;
  margin-top: -2px;
}

.empty-card {
  background: #0d0d0d;
  border: 1px dashed #1e1e1e;
  border-radius: 10px;
  padding: 24px;
  color: #333;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}

footer {
  border-top: 1px solid #1a1a1a;
  padding: 24px 48px;
  text-align: center;
  font-size: 12px;
  color: #444;
}
</style>
</head>
<body>

<header>
  <div class="logo">NupPy</div>
  <nav>
    <button onclick="switchTab('edebiyat')" id="tab-edebiyat">Edebiyat</button>
    <button onclick="switchTab('cografya')" id="tab-cografya">Coğrafya</button>
    <button onclick="switchTab('fizik')" id="tab-fizik">Fizik</button>
  </nav>
</header>

<main>

  <!-- EDEBİYAT -->
  <div class="tab-content" id="content-edebiyat">
    <div class="tab-header">
      <h2>Edebiyat</h2>
      <p>Edebiyat dersine ait sunumlar</p>
    </div>
    <div class="card-grid">
      <div class="empty-card">+ Henüz sunum eklenmedi</div>
    </div>
  </div>

  <!-- COĞRAFYA -->
  <div class="tab-content" id="content-cografya">
    <div class="tab-header">
      <h2>Coğrafya</h2>
      <p>Coğrafya dersine ait sunumlar</p>
    </div>
    <div class="card-grid">
      <div class="empty-card">+ Henüz sunum eklenmedi</div>
    </div>
  </div>

  <!-- FİZİK -->
  <div class="tab-content" id="content-fizik">
    <div class="tab-header">
      <h2>Fizik</h2>
      <p>Fizik dersine ait sunumlar</p>
    </div>
    <div class="card-grid">
      <a class="card" href="https://docs.google.com/presentation/d/1JOaDKutwGjgJP_6wn3emF_rlhtrFCe63/edit?usp=sharing&ouid=112056762520635185399&rtpof=true&sd=true" target="_blank">
        <span class="card-icon">↗</span>
        <div class="card-label label-fizik">Fizik</div>
        <div class="card-title">Fiziğe Yön Veren Bilim İnsanları</div>
        <div class="card-meta">Google Slides</div>
      </a>
    </div>
  </div>

</main>

<footer>nuppydevs.github.io — NupPy</footer>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.className = '');
  document.getElementById('content-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).className = 'active-' + tab;
}
switchTab('fizik');
</script>
</body>
</html>
